<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Flower Bloom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1468327768560-75b778cbb551?w=500" alt="">

<footer>
    <p>📞 +7 777 777 77 77</p>
